<style>
  :root {
    --bg: #ffffff;

    --accent-ir: #2563eb;
    --accent-pr: #d97706;
    --accent-cross: #db2777;

  * { box-sizing: border-box; }

               font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
               overflow: hidden; }
  #network  { background: var(--bg); position: relative; width: 100vw; height: 100vh; }
  #panel    { position: absolute; right: 16px; top: 70px; width: 380px;
              max-height: calc(100vh - 90px);
              background: rgba(255,255,255,.97); backdrop-filter: blur(10px);
              border: 1px solid var(--border); border-radius: 12px;
              padding: 22px 24px 20px; overflow-y: auto;
              box-shadow: 0 8px 30px rgba(0,0,0,.10);
              z-index: 20; display: none; }
  #panel.visible { display: block; }
  #panel .close { position: absolute; right: 12px; top: 12px;
                  background: transparent; border: 0; font-size: 22px;
                  color: var(--muted); cursor: pointer; padding: 0; line-height: 1; }
  #panel .close:hover { color: var(--text); }
  #panel h2 { font-size: 20px; margin: 0 0 8px; line-height: 1.25; padding-right: 24px; }
  #panel .era-tag { display: inline-block; padding: 3px 10px; font-size: 11px;
                    border-radius: 999px; background: #eef0f4; color: var(--muted);
                    margin-bottom: 14px; letter-spacing: 0.04em; }
  #panel .era-tag.ir { background: rgba(37,99,235,.10); color: var(--accent-ir); }
  #panel .era-tag.pr { background: rgba(217,119,6,.12); color: var(--accent-pr); }
  #panel p { line-height: 1.55; color: #2d323d; font-size: 14px; margin: 0 0 12px; }
  #panel ul { padding-left: 20px; margin: 0 0 14px; }
  #panel li { line-height: 1.55; color: #2d323d; font-size: 14px; margin-bottom: 4px; }
  #panel strong { color: var(--text); }
  #legend { position: absolute; left: 16px; top: 16px; background: rgba(255,255,255,.92);
            backdrop-filter: blur(8px); border: 1px solid var(--border);
            padding: 12px 14px; border-radius: 10px; font-size: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.04); color: var(--text); z-index: 10; }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend .dot { width: 12px; height: 12px; border-radius: 50%; }
  #search { position: absolute; right: 16px; top: 16px;
            z-index: 30;
            background: rgba(255,255,255,.95); border: 1px solid var(--border);
            color: var(--text); padding: 8px 12px; border-radius: 8px;
            font-size: 13px; width: 220px; outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,.04); z-index: 10; }

  #search:focus { border-color: var(--accent-ir); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 16px; }

</aside>

// ---------- DATA ----------
const IR = "ir", PR = "pr";

const nodes = [
  // Root

        "Cranfield experiments (1958-66) — birth of precision/recall",
        "TREC (1992) — Cranfield methodology at web scale",
        "DIALOG (1967), MEDLINE (1970) — closed, curated collections"

      keyIdea: "Boolean (yes/no) broke at scale → Ranked retrieval was born."
    }

  { id: "ir_e1_salton", label: "Salton & TF-IDF", level: 3, group: IR,

  { id: "ir_e1_trec", label: "Cranfield & TREC", level: 3, group: IR,

  // IR Era 2: Web 1.0
  { id: "ir_e2", label: "2. Web 1.0\n(1990–2004)", level: 2, group: IR,

        "Yahoo! Directory (1994) — manual curation, did not scale",

  { id: "ir_e2_google", label: "Birth of\nGoogle (1998)", level: 3, group: IR,

  { id: "ir_e2_florida", label: "Florida Update\n(Nov 16, 2003)", level: 3, group: IR,

  // IR Era 3: Web 2.0
  { id: "ir_e3", label: "3. Web 2.0\n(2004–2014)", level: 2, group: IR,

        "Vertical search: Kayak, Yelp, IMDb, Amazon A9",

        "Universal Search — May 2007 (end of '10 blue links')",
        "iPhone — Jun 2007 (mobile queries differ: short, voice, location)",

      keyIdea: "Static content → UGC explosion → personalization + vertical."
    } },
  { id: "ir_e3_personal", label: "Personalized\nSearch (2005)", level: 3, group: IR,

  { id: "ir_e3_universal", label: "Universal Search\n+ Mobile", level: 3, group: IR,

  { id: "ir_e4_schema", label: "schema.org &\nWikidata", level: 3, group: IR,

  // IR Era 5: Knowledge Graph
  { id: "ir_e5", label: "5. Knowledge\nGraph (2012–18)", level: 2, group: IR,
    body: {
      summary: "Things, not strings. Google KG turned search results into answers. Watson won Jeopardy.",
      points: [
        "Amit Singhal blog — May 16, 2012: 'things, not strings'",
        "At launch: 500M entities, 3.5B properties/relations",
        "Sources: Freebase (Google acquired in 2010), Wikipedia, CIA Factbook",
        "Bing Satori (2013), Microsoft KG",
        "Hummingbird (2013) — rewrite of the core ranking algorithm",
        "RankBrain (Oct 2015) — Google's first openly admitted ML signal",
        "IBM Watson Jeopardy! — Feb 14, 2011 (90 servers, 2880 cores)",
        "Siri (2011), Alexa (2014) — entity-driven voice search"
      ],
      keyIdea: "Search results → answers. Queries now match entities, not just documents."
    } },
  { id: "ir_e5_kg", label: "Google KG\n(May 2012)", level: 3, group: IR,
    body: { summary: "For 'Obama wife', Obama → spouse → Michelle Obama is now a direct answer. Featured snippets and knowledge panels come from here.",
            points: ["500M entities, 3.5B relations at launch", "Freebase + Wikipedia + CIA World Factbook", "Bing Satori — parallel push, 2013"],

  { id: "ir_e5_ml", label: "Hummingbird +\nRankBrain", level: 3, group: IR,

      points: [

        "GloVe (Stanford, 2014)",
        "Transformer (Vaswani et al., Jun 2017)",
        "BERT (Oct 2018) → Google Search (Oct 25, 2019)",
        "DPR (2020) — beat BM25 by 9-19 points",
        "ColBERT (2020) — late interaction",
        "SPLADE (2021) — learned sparse",
        "CLIP (Jan 2021) — image + text in one space",

  { id: "ir_e6_bert", label: "BERT in Search\n(Oct 25, 2019)", level: 3, group: IR,

    body: {
      summary: "ChatGPT shock → search race. RAG as production standard. AI Overviews + Deep Research.",
      points: [
        "ChatGPT — Nov 30, 2022 (1M in 5 days, 100M MAU by Jan 2023)",
        "Google 'code red' — Dec 2022",

  { id: "pr_root", label: "PageRank Evolution\n(5 Eras)", level: 1, group: "pr_root" },

  // PR Era 1: Birth
  { id: "pr_e1", label: "Era 1 · Birth\n(1996–1998)", level: 2, group: PR,
    body: {
      summary: "BackRub project at Stanford. Inspired by bibliometrics — the web as a citation graph.",
      points: [
        "Inspiration: Garfield's Citation Index (1955)",
        "Pinski & Narin (1976) — weighted citation, recursive definition (PageRank's ancestor)",
        "Page & Brin BackRub (1996) — Stanford",
        "Random surfer + damping (0.85)",
        "WWW7 paper — April 1998",

  // PR Era 3: Spam War
  { id: "pr_e3", label: "Era 3 · Spam\nWar (2002-05)", level: 2, group: PR,
    body: {
      summary: "PageRank manipulation became an industry. Topic-Sensitive PR, TrustRank, Florida hit back.",
      points: [
        "Link farms, reciprocal linking, comment spam, link sales",
        "Topic-Sensitive PageRank — Haveliwala (2002)",

      points: [

// ---------- VIS NETWORK ----------
const groupStyles = {
  root:     { color: { background: "#1f2937", border: "#111827" },
              font: { size: 28, color: "#ffffff" }, shape: "box", borderWidth: 2 },
  ir_root:  { color: { background: "#2563eb", border: "#1d4ed8" },
              font: { size: 24, color: "#ffffff" }, shape: "box", borderWidth: 2 },
  pr_root:  { color: { background: "#d97706", border: "#b45309" },
              font: { size: 24, color: "#ffffff" }, shape: "box", borderWidth: 2 },
  ir:       { color: { background: "#dbeafe", border: "#2563eb" },
              font: { size: 20, color: "#1e3a8a" }, shape: "box", borderWidth: 1.5 },
  pr:       { color: { background: "#fef3c7", border: "#d97706" },
              font: { size: 20, color: "#78350f" }, shape: "box", borderWidth: 1.5 },
};

// Mirror the two branches around the central root:
//   IR grows UPWARD (leaves at the top, eras above the IR root)
//   Root sits in the middle
//   PR grows DOWNWARD (eras below, leaves at the bottom)
// With direction "UD", lower visLevel = higher on screen.
function computeVisLevel(n) {
  if (n.id === "root") return 3;
  const isIR = n.id === "ir_root" || n.id.startsWith("ir_");
  const isPR = n.id === "pr_root" || n.id.startsWith("pr_");
  if (isIR) return 3 - n.level;    // ir_root → 2, era → 1, leaf → 0
  if (isPR) return 3 + n.level;    // pr_root → 4, era → 5, leaf → 6
  return n.level;
}

const visNodes = nodes.map(n => {
  const level3 = (n.level === 3);
  const base = groupStyles[n.group] || groupStyles.ir;
  return {
    id: n.id,
    label: n.label,
    level: computeVisLevel(n),
    color: base.color,
    font: { ...base.font, size: level3 ? 16 : base.font.size, multi: true },
    shape: base.shape,
    borderWidth: base.borderWidth,
    margin: 16,
    widthConstraint: { minimum: level3 ? 140 : 180, maximum: 240 },
    title: n.title || (n.body ? n.body.summary : undefined),
    _body: n.body,
    _group: n.group,
  };
});

const visEdges = edges.map(e => ({
  from: e.from, to: e.to,
  dashes: !!e.dashes,
  color: e.group === "cross" ? { color: "#db2777", opacity: 0.8 }
                              : { color: "#9ca3af", opacity: 0.7 },
  width: e.group === "cross" ? 2 : 1,
  label: e.label,
  font: { color: "#db2777", size: 11, strokeWidth: 0, background: "rgba(255,255,255,.85)" },
  smooth: { type: "cubicBezier" },
  arrows: { to: { enabled: false } },
}));

const container = document.getElementById("network");
const data = { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(visEdges) };

const options = {
  layout: {
    hierarchical: {
      enabled: true,
      direction: "UD",
      sortMethod: "hubsize",
      shakeTowards: "roots",
      levelSeparation: 220,
      nodeSpacing: 160,
      treeSpacing: 260,
      blockShifting: true,
      edgeMinimization: true,
      parentCentralization: true,
    },
  },
  autoResize: true,
  physics: { enabled: false },
  interaction: { hover: true, tooltipDelay: 200, navigationButtons: false, keyboard: false },
  edges: { selectionWidth: 2 },
};

const network = new vis.Network(container, data, options);

// ---------- PANEL ----------
const panel = document.getElementById("panel");
const panelBody = document.getElementById("panel-body");
const closeBtn = panel.querySelector(".close");

function hidePanel() { panel.classList.remove("visible"); }
function showPanel() { panel.classList.add("visible"); }
closeBtn.addEventListener("click", hidePanel);

function renderNode(n) {
  if (!n) return;
  const era = n._group === "ir" ? '<span class="era-tag ir">IR EVOLUTION</span>'
            : n._group === "pr" ? '<span class="era-tag pr">PAGERANK EVOLUTION</span>'
            : '<span class="era-tag">ROADMAP</span>';
  const body = n._body;
  let html = era + `<h2>${n.label.replace(/\n/g, " ")}</h2>`;
  if (body) {
    html += `<p>${body.summary}</p>`;
    if (body.points && body.points.length) {
      html += "<ul>" + body.points.map(p => `<li>${p}</li>`).join("") + "</ul>";
    }
    if (body.keyIdea) {
      html += `<p><strong>Key idea:</strong> ${body.keyIdea}</p>`;
    }
  } else {
    html += `<p>${n.title || "This is a category header — click its sub-nodes."}</p>`;
  }
  panelBody.innerHTML = html;
  showPanel();
}

network.on("selectNode", (e) => {
  const n = data.nodes.get(e.nodes[0]);
  renderNode(n);
});
network.on("doubleClick", (e) => {
  if (e.nodes[0]) network.focus(e.nodes[0], { scale: 1.2, animation: { duration: 600 } });
});
network.on("deselectNode", hidePanel);
network.on("click", (params) => {
  if (params.nodes.length === 0) hidePanel();
});

// ---------- SEARCH ----------
const searchBox = document.getElementById("search");
searchBox.addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const match = visNodes.find(n =>
    n.label.toLowerCase().includes(q) ||
    (n._body && n._body.summary && n._body.summary.toLowerCase().includes(q))
  );
  if (match) {
    network.selectNodes([match.id]);
    network.focus(match.id, { scale: 1.1, animation: { duration: 500 } });
    renderNode(data.nodes.get(match.id));
  }
});
searchBox.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.target.value = ""; }
});

// Initial layout — fit, but enforce a minimum scale so labels stay readable,
// and bias view towards the top so the graph fills the canvas vertically.
function layoutView(animate = false) {
  network.fit({ animation: false });
  const minScale = 0.55;
  const currentScale = network.getScale();
  const scale = Math.max(currentScale, minScale);

  const positions = network.getPositions();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  Object.values(positions).forEach(p => {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });
  const centerX = (minX + maxX) / 2;
  // y so that the top of the graph sits ~80px below the top of the viewport
  const viewportTopInGraph = minY - (80 / scale);
  const targetY = viewportTopInGraph + (window.innerHeight / 2) / scale;

  network.moveTo({
    position: { x: centerX, y: targetY },
    scale,
    animation: animate ? { duration: 300 } : false
  });
}

network.once("afterDrawing", () => layoutView(false));
window.addEventListener("resize", () => layoutView(true));
</script>
